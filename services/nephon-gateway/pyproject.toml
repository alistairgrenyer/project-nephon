[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nephon-gateway"
version = "0.1.0"
description = "Nephon Constitutional Gateway (Policy Decision Point)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
    "nephon-contracts>=0.1.0",
    "nephon-graph>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
